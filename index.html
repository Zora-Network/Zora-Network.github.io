<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zora Network</title>
  <meta name="description" content="Zora Network is an Ethereum Layer 2 for creators, NFT projects, and onchain media.">
  <link rel="canonical" href="https://zora-network.github.io/">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#F7F5F1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zora Network">
  <meta property="og:description" content="Zora Network is an Ethereum Layer 2 for creators, NFT projects, and onchain media.">
  <meta property="og:url" content="https://zora-network.github.io/">
  <meta property="og:image" content="https://zora-network.github.io/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zora Network">
  <meta name="twitter:description" content="Zora Network is an Ethereum Layer 2 for creators, NFT projects, and onchain media.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://zora-network.github.io/#website",
        "url": "https://zora-network.github.io/",
        "name": "Zora Network",
        "inLanguage": "en"
      },
      {
        "@type": "Organization",
        "@id": "https://zora-network.github.io/#organization",
        "name": "Zora",
        "url": "https://zora.co/",
        "logo": "https://zora-network.github.io/favicon.png"
      },
      {
        "@type": "WebApplication",
        "@id": "https://zora-network.github.io/#app",
        "name": "Zora Network",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://zora-network.github.io/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>

  <link rel="prefetch" href="dashboard/">
  <link rel="prerender" href="dashboard/">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard/" rel="noopener noreferrer" aria-label="Zora Network home">
      <img src="favicon.png" width="30" height="30" alt="">
      <span>Zora Network</span>
    </a>
    <nav class="nav" aria-label="Authority references">
      <a href="https://zora.co/" target="_blank" rel="nofollow noopener noreferrer">Zora</a>
      <a href="https://explorer.zora.energy/" target="_blank" rel="nofollow noopener noreferrer">Explorer</a>
      <a href="https://l2beat.com/scaling/projects/zora" target="_blank" rel="nofollow noopener noreferrer">L2BEAT</a>
    </nav>
    <span class="spacer"></span>
    <a class="ghost" href="dashboard/" rel="noopener noreferrer">Open app</a>
  </header>

  <main class="stage">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Zora Network</h1>
      <p class="sub"><strong>Zora Network</strong> is an Ethereum Layer 2 for creators, NFT projects, and onchain media.</p>
    </section>

    <section class="app-card" aria-label="Network entry">
      <div class="route">
        <div class="leg">
          <span class="label">From</span>
          <span class="chip">
            <img src="coredao.png" width="30" height="30" alt="Ethereum">
            <span>ETH</span>
          </span>
        </div>
        <button class="switch" type="button" data-switch aria-label="Switch network direction">
          <span aria-hidden="true">&#8594;</span>
        </button>
        <div class="leg">
          <span class="label">To</span>
          <span class="chip chip-muted">
            <img src="eth.png" width="30" height="30" alt="Zora Network">
            <span>Zora Network</span>
          </span>
        </div>
      </div>
      <a class="primary" href="dashboard/" rel="noopener noreferrer">Enter App <span aria-hidden="true">&#8250;</span></a>
    </section>
  </main>

  <footer class="foot">Zora Network &mdash; 2026</footer>

  <script>
  (function () {
    "use strict";
    var button = document.querySelector("[data-switch]");
    if (!button) return;

    button.addEventListener("click", function () {
      var chips = document.querySelectorAll(".leg .chip");
      if (chips.length < 2) return;
      var first = chips[0].innerHTML;
      chips[0].innerHTML = chips[1].innerHTML;
      chips[1].innerHTML = first;
    });
  }());
  </script>
</body>
</html>
